name: CI
on:
  pull_request:
  push:
    # main, and the phase branches (so a phase branch is checked before its pull request is opened).
    branches: [main, 'phase-*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
